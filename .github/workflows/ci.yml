name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  # Lets you re-run the suite by hand from the Actions tab.
  workflow_dispatch:

jobs:
  test:
    name: Test on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      # Report every failing version, not just the first one to break.
      fail-fast: false
      matrix:
        # 18.17 is the floor declared in package.json engines.
        node: ['18.17', '20', '22']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        # The suite stubs the directory API, so this needs no network access.
        run: npm test

  # Proves the published tarball actually works as an installed CLI, which
  # `npm test` alone does not cover — it exercises bin/, the shebang and the
  # files list rather than the source tree.
  smoke:
    name: Smoke test the packed CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Pack and install globally
        run: |
          npm pack
          npm install -g ./rn-arch-check-*.tgz

      - name: Check the binary responds
        run: |
          rn-arch-check --version
          rn-arch-check --help

      - name: Scan the bundled mock project
        # This step talks to the live directory, so it deliberately asserts
        # only what the CLI controls: that it runs, exits with a code it
        # defines, and emits the documented JSON shape. It does NOT assert any
        # particular package's status — that is third-party data which can
        # change at any time, and pinning it here would turn someone else's
        # edit into a failing build.
        run: |
          set +e
          output=$(rn-arch-check --path test/fixtures/mock-project --json)
          code=$?
          set -e
          echo "$output"

          # 0 = clean, 1 = incompatible found. Both mean the CLI worked.
          # 2 means no lookup succeeded, i.e. the directory is unreachable —
          # an outage on their side, not a regression on ours.
          if [ "$code" -eq 2 ]; then
            echo "::warning::directory lookups failed (exit 2) — treating as an upstream outage"
            exit 0
          fi
          if [ "$code" -ne 0 ] && [ "$code" -ne 1 ]; then
            echo "::error::unexpected exit code $code"
            exit 1
          fi

          echo "$output" | node -e '
            let s = "";
            process.stdin.on("data", (d) => (s += d)).on("end", () => {
              const report = JSON.parse(s);
              if (report.projectName !== "mock-rn-app") {
                throw new Error(`unexpected projectName: ${report.projectName}`);
              }
              if (!Array.isArray(report.results) || report.results.length === 0) {
                throw new Error("expected a non-empty results array");
              }
              const valid = new Set([
                "compatible", "incompatible", "unverified", "unlisted", "unknown",
              ]);
              for (const r of report.results) {
                if (!valid.has(r.status)) throw new Error(`bad status: ${r.status}`);
              }
              console.log(`smoke test passed: ${report.results.length} packages checked`);
            });
          '
