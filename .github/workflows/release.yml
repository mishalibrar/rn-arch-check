name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for provenance. With a trusted publisher configured, npm also
      # uses this to mint a short-lived credential instead of a stored token.
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing requires npm >= 11.5.1.
      - run: npm install -g npm@latest

      - run: npm ci --ignore-scripts

      # Publishing a tag that disagrees with the manifest silently ships the
      # wrong version, and npm versions cannot be reused once taken.
      - name: Verify the tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest=$(node -p "require('./package.json').version")
          echo "tag=$tag manifest=$manifest"
          if [ "$tag" != "$manifest" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $manifest"
            exit 1
          fi

      - run: node --test test/*.test.js
      - run: npm audit signatures

      # Published over OIDC against the trusted publisher configured on npmjs.com
      # for this repository and workflow. No long-lived credential exists
      # anywhere: the `id-token: write` permission above is what mints the
      # short-lived one, and the same permission signs the provenance.
      - run: npm publish --access public --provenance
